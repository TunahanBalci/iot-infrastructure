[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-processor"
version = "0.1.0"
description = "Telemetry processor: validates TBMQ integration envelopes from Kafka into keyed tunnel detections"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.6,<3",
    "orjson>=3.10",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0",
    # Imported only when OTEL_EXPORTER_OTLP_ENDPOINT is set.
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
telemetry-processor = "telemetry_processor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
# Integration tests start a SASL_SSL Kafka in Docker: pytest -m integration
addopts = "-m 'not integration'"
markers = ["integration: needs Docker (starts Kafka with SASL_SSL + SCRAM-SHA-512)"]
