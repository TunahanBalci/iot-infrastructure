[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tunnel-consensus"
version = "0.1.0"
description = "Consensus service: fuses tunnel sensor detections (MQTT 5.0 or Kafka) into vehicle events"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.1,<3",
    "orjson>=3.10",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0",
    "confluent-kafka>=2.6,<3",
    # Tracing (imported only when OTEL_EXPORTER_OTLP_ENDPOINT is set)
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]

[project.optional-dependencies]
# End-to-end tests drive the simulator model in-process: pip install -e ../simulator
test = ["pytest>=8"]

[project.scripts]
tunnel-consensus = "tunnel_consensus.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../simulator/src", "tests"]
# Integration tests need Docker (Kafka 4.3.1 SASL_SSL/SCRAM) and take minutes: pytest -m integration
addopts = "-m 'not integration'"
markers = ["integration: real Kafka in Docker (pytest -m integration)"]
