[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tunnel-sim"
version = "0.1.0"
description = "High-volume IoT simulator: tunnel vehicle sensors publishing over MQTT 5.0"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.1,<3",
    "orjson>=3.10",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tunnel-sim = "tunnel_sim.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
