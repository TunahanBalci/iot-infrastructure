# KEDA (Helm values): workload autoscaling on Kafka consumer-group lag (telemetry-processor,
# consensus, TBMQ integration executor). Node autoscaling (Karpenter) is out of scope here.
resources:
  operator:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 384Mi
  metricServer:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  webhooks:
    requests:
      cpu: 20m
      memory: 48Mi
    limits:
      memory: 192Mi
prometheus:
  operator:
    enabled: true                 # :8080/metrics — scaler errors, scaled object status
  metricServer:
    enabled: true
